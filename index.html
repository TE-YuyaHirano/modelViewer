<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>from Kid A</title>
  <meta name="description" content="modelViewer" />
  <style>
    :root { --bg:#0b0f14; --panel:rgba(20,24,31,.75); --text:#e8eef7; --muted:#9fb2c7; --accent:#7cc4ff; }
    html,body { height:100%; margin:0; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    #app { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
    #stage { position: relative; background: radial-gradient(1200px 600px at 50% 120%, #0f141d, #0b0f14); }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .brand { position:absolute; left: env(safe-area-inset-left); top: env(safe-area-inset-top); margin:12px; padding:8px 10px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; background:var(--panel); backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,.06); border-radius:12px; user-select:none; }
    #toolbar { display:grid; grid-auto-flow:column; gap:8px; padding:10px; align-items:center; justify-content:center; background: linear-gradient(to bottom, rgba(0,0,0,.0), rgba(0,0,0,.1)), var(--panel); border-top:1px solid rgba(255,255,255,.06); position: sticky; bottom:0; z-index:5; }
    .btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 12px; border-radius:12px; background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:var(--text); font-size:14px; cursor:pointer; transition: transform .05s ease, background .2s ease, border-color .2s ease; }
    .btn:active { transform: translateY(1px); }
    .btn[aria-pressed="true"] { outline:2px solid var(--accent); }
    #progress { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:min(70vw,360px); height:6px; background: rgba(255,255,255,.06); border-radius:999px; overflow:hidden; opacity:0; transition:opacity .2s ease; }
    #progress .bar { height:100%; width:0%; background: linear-gradient(90deg, var(--accent), #a0e9ff); }
    #toast { position:absolute; left:50%; top:16px; transform:translateX(-50%); background: var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:8px 12px; font-size:13px; color:var(--muted); opacity:0; transition:opacity .2s ease; }
    #toast.show { opacity:1; }
    @media (max-width:480px) { .btn span{display:none;} .btn{padding:0 10px;} .brand{font-size:10px;} }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div id="stage">
      <div class="brand" id="brand">Three.js OBJ Viewer</div>
      <div id="progress"><div class="bar"></div></div>
      <div id="toast"></div>
    </div>
    <div id="toolbar" aria-label="viewer-controls">
      <button class="btn" id="autorotateBtn" aria-pressed="false" title="自動回転オン/オフ">🔄 <span>自動回転</span></button>
      <button class="btn" id="resetBtn" title="ビューをリセット">🎯 <span>リセット</span></button>
      <button class="btn" id="gridBtn" aria-pressed="false" title="グリッド表示">#️⃣ <span>グリッド</span></button>
      <button class="btn" id="bgBtn" title="背景の切替">🌓 <span>背景</span></button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // DOM refs
    const stage = document.getElementById('stage');
    const progress = document.getElementById('progress');
    const bar = progress.querySelector('.bar');
    const toast = document.getElementById('toast');
    const toolbar = document.getElementById('toolbar');
    const brand = document.getElementById('brand');

    // URL params
    const params = new URLSearchParams(location.search);

    // UI表示/非表示
    // デフォルトは UI=off（純ビューア）。UIを表示したい場合だけ ?ui=on を付ける
    const uiOn = (params.get('ui') || '').toLowerCase() === 'on';
    const uiOff = !uiOn;
    if (uiOff) {
      toolbar.style.display = 'none';
      brand.style.display = 'none';
      // 余白も不要なら app の row を1段に
      document.getElementById('app').style.gridTemplateRows = '1fr';
    }

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // Sketchfab寄り：色味を崩しにくい Neutral をデフォルトに（必要なら ?tonemap=aces でACESに戻せます）
    const tonemap = (params.get('tonemap') || 'neutral').toLowerCase(); // neutral | aces | linear
    renderer.toneMapping = (tonemap === 'aces')
      ? THREE.ACESFilmicToneMapping
      : (tonemap === 'linear')
        ? THREE.LinearToneMapping
        : THREE.NeutralToneMapping;

    // 露出（明るさ）：URLで調整可能 例) ?exposure=1.0
    const exposure = parseFloat(params.get('exposure') || '1.0');
    renderer.toneMappingExposure = (isFinite(exposure) ? exposure : 1.0);

    // ライト計算をよりPBR寄りに（見た目の安定性が上がる）
    renderer.physicallyCorrectLights = true;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(stage.clientWidth, stage.clientHeight);
    // 影：URLで無効化/シャープ切替 例) ?shadows=off  /  ?shadowSoft=on
    const shadowsOff = (params.get('shadows') || '').toLowerCase() === 'off';
    const shadowSoft = (params.get('shadowSoft') || '').toLowerCase() === 'on'; // デフォルトはシャープ
    renderer.shadowMap.enabled = !shadowsOff;
    renderer.shadowMap.type = shadowSoft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
    stage.appendChild(renderer.domElement);

    // Scene & Camera
    const scene = new THREE.Scene();
    scene.background = null; // transparent (toggleable)

    const camera = new THREE.PerspectiveCamera(60, stage.clientWidth / stage.clientHeight, 0.01, 1000);
    camera.position.set(2.4, 1.4, 2.4);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    // イントロ中はカメラを手動で動かすので、damping を一時的に切ってズレ（ジャンプ）を防ぐ
    const WAS_DAMPING = controls.enableDamping;
    controls.screenSpacePanning = true;
    controls.minDistance = 0.1;
    controls.maxDistance = 5000;

    // Grid（中央に見えるメッシュ）
    // デフォルトは非表示。必要なら URL で ?grid=on、またはボタンで表示できます。
    const grid = new THREE.GridHelper(10, 20, 0x335577, 0x223344);
    grid.material.opacity = 0.25;
    grid.material.transparent = true;

    const gridOn = (params.get('grid') || '').toLowerCase() === 'on';
    grid.visible = gridOn;

    scene.add(grid);

    // Lights（Sketchfabの“ニュートラルスタジオ”寄り）
    // ねらい：床（緑）が暗く沈まないように「間接光」を厚めにしつつ、赤がオレンジに転ばないように白飛びを抑える

    // 全体の底上げ（暗部を持ち上げる）
    const amb = new THREE.AmbientLight(0xffffff, 0.22);

    // 半球ライト：地面側を明るめグレーにして床の受けを強化（緑の沈みを軽減）
    const hemi = new THREE.HemisphereLight(0xffffff, 0xf2f5fb, 1.05);

    // メインライト（影を作る主役：強すぎると赤が薄く/オレンジ寄りに見えるので控えめ）
    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(6, 9, 7);
    key.castShadow = !shadowsOff;
    scene.add(key.target);

    // フィル（影を潰しすぎずに持ち上げる）
    const fill = new THREE.DirectionalLight(0xffffff, 0.55);
    fill.position.set(-7, 5, 6);

    // リム（輪郭：弱め）
    const rim = new THREE.DirectionalLight(0xffffff, 0.22);
    rim.position.set(0, 7, -9);

    // 裏側ライト（背面が暗く沈むのを防ぐ）
    // 例) ?backLight=0.28  （0で無効）
    const backLightInt = parseFloat(params.get('backLight') || '2.0');
    const back = new THREE.DirectionalLight(0xffffff, (isFinite(backLightInt) ? backLightInt : 2.0));
    back.position.set(0, 5, -7);

    // トップ（床の暗さ対策：薄く）
    const top = new THREE.DirectionalLight(0xffffff, 0.18);
    top.position.set(0, 13, 0);

    // 影の品質設定（シャープ寄り）
    // - mapSize を上げるほど輪郭が綺麗（重くなる）
    // - PCFSoft の場合は radius で柔らかさを調整
    if (!shadowsOff) {
      const map = parseInt(params.get('shadowMap') || '4096', 10); // 例) ?shadowMap=2048
      const mapSize = (isFinite(map) ? Math.max(512, Math.min(map, 4096)) : 4096);
      key.shadow.mapSize.set(mapSize, mapSize);

      key.shadow.bias = -0.00008;
      key.shadow.normalBias = 0.02;

      // 輪郭（シャープ時は 0、ソフト時は少しだけ）
      key.shadow.radius = shadowSoft ? 2 : 0;
      // カメラ範囲はモデル毎にframeSelectionで設定
    }

    scene.add(amb, hemi, key, fill, rim, back, top);

    // 影受け（透明床）
    // デフォルトは無効（影が“透明床”に落ちないようにする）。
    // 必要なときだけ URL で ?shadowCatcher=on を付けて有効化できます。
    const shadowCatcherOn = (params.get('shadowCatcher') || '').toLowerCase() === 'on';
    let shadowCatcher = null;

    if (!shadowsOff && shadowCatcherOn) {
      // 影の濃さ：例) ?shadowOpacity=0.35
      // デフォルトは「見える」濃さに寄せる（シャープ影は少し濃いめ）
      const shadowOpacity = parseFloat(params.get('shadowOpacity') || (shadowSoft ? '0.24' : '0.36'));
      const shadowMat = new THREE.ShadowMaterial({ opacity: (isFinite(shadowOpacity) ? shadowOpacity : (shadowSoft ? 0.24 : 0.36)) });
      shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shadowMat);
      shadowCatcher.rotation.x = -Math.PI / 2;
      shadowCatcher.position.set(0, 0, 0); // 後でモデルの底面に合わせて更新する
      shadowCatcher.receiveShadow = true;
      scene.add(shadowCatcher);
    }

    // Environment（HDRが無ければRoomEnvironmentでそれっぽく）
    const pmrem = new THREE.PMREMGenerator(renderer);
    let envMap = null;

    const hdrUrl = params.get('hdr');
    if (hdrUrl) {
      new RGBELoader().load(
        hdrUrl,
        (hdr) => {
          envMap = pmrem.fromEquirectangular(hdr).texture;
          scene.environment = envMap;
          hdr.dispose();
        },
        undefined,
        () => {
          const room = new RoomEnvironment();
          scene.environment = pmrem.fromScene(room, 0.04).texture;
        }
      );
    } else {
      const room = new RoomEnvironment();
      scene.environment = pmrem.fromScene(room, 0.04).texture;
    }

    // Model pivot
    const pivot = new THREE.Group();
    scene.add(pivot);

    // State
    let currentObject = null;
    let autoRotate = false;
    // 背景（デフォルトは明るめ）
    let backgroundSolid = true;
    const BG_LIGHT = new THREE.Color('#e9eef6');
    const BG_DARK  = new THREE.Color('#0b0f14');
    scene.background = BG_LIGHT;

    // Toast helper
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Loading manager
    const manager = new THREE.LoadingManager();
    manager.onStart = () => { progress.style.opacity = 1; bar.style.width = '0%'; };
    manager.onProgress = (_, loaded, total) => { bar.style.width = `${Math.round((loaded / total) * 100)}%`; };
    manager.onLoad = () => { progress.style.opacity = 0; };
    manager.onError = (url) => {
      console.error('Failed to load:', url);
      showToast('読み込み失敗（404等）: ' + url);
    };

    const objLoader = new OBJLoader(manager);
    const mtlLoader = new MTLLoader(manager);

    function clearModel() {
      if (!currentObject) return;
      pivot.remove(currentObject);
      currentObject.traverse((n) => {
        if (n.isMesh) {
          n.geometry?.dispose?.();
          if (Array.isArray(n.material)) n.material.forEach((m) => m.dispose?.());
          else n.material?.dispose?.();
        }
      });
      currentObject = null;
    }

    function frameSelection(object, padding = 1.7) {
      const box = new THREE.Box3().setFromObject(object, true);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      if (!isFinite(size.length())) return null;

      // Re-center around origin
      const offset = center.clone().multiplyScalar(-1);
      pivot.position.copy(offset);
      // pivot移動後はワールド行列を更新してからBBoxを取る（これをしないと影受けがズレる）
      pivot.updateWorldMatrix(true, true);

      // リセンタ後のワールドBBox（影受け・影カメラ調整に使う）
      // object単体ではなく pivot 全体から取ることで、親の移動（pivot.position）も確実に反映される
      const worldBoxAfterCenter = new THREE.Box3().setFromObject(pivot, true);
      const worldSize = worldBoxAfterCenter.getSize(new THREE.Vector3());
      const worldCenter = worldBoxAfterCenter.getCenter(new THREE.Vector3());

      const target = new THREE.Vector3(0, 0, 0);
      controls.target.copy(target);

      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * Math.PI / 180;
      let radius = (maxDim / (2 * Math.tan(fov / 2))) * padding;
      radius = Math.min(Math.max(radius, 0.5), 10000);

      // いい感じの斜め上から（dir*radius は target からのオフセット）
      const dir = new THREE.Vector3(1, 0.75, 1).normalize();
      const offsetVec = dir.clone().multiplyScalar(radius);
      const camPos = target.clone().add(offsetVec);

      camera.position.copy(camPos);
      camera.near = radius / 100;
      camera.far = radius * 100;
      camera.updateProjectionMatrix();

      // OrbitControls の内部状態を今のカメラに同期
      controls.target.copy(target);
      controls.update();

      // 影受け（shadow catcher）を「モデルの底面」に合わせ、サイズもモデルに合わせる
      if (shadowCatcher) {
        const eps = 0.002;
        shadowCatcher.position.set(worldCenter.x, worldBoxAfterCenter.min.y - eps, worldCenter.z);

        // モデルの大きさ + 余白で影受けサイズを決める
        const pad = 1.6;
        const sx = Math.max(0.01, worldSize.x * pad);
        const sz = Math.max(0.01, worldSize.z * pad);
        shadowCatcher.scale.set(sx, sz, 1);
      }

      // 影のスケール/位置をモデルに合わせる（固定dだと縮尺がズレやすい）
      if (!shadowsOff && key.castShadow) {
        // 影カメラの範囲（モデルのXY/Zを覆う）
        const half = Math.max(worldSize.x, worldSize.z) * 0.6; // 少し余白込み
        key.shadow.camera.left = -half;
        key.shadow.camera.right = half;
        key.shadow.camera.top = half;
        key.shadow.camera.bottom = -half;

        // 影カメラのnear/far（モデル高さに応じて）
        key.shadow.camera.near = 0.1;
        key.shadow.camera.far = Math.max(10, worldSize.y * 6 + 50);

        // ターゲットをモデル中心へ（影の位置が安定）
        key.target.position.copy(worldCenter);

        key.shadow.camera.updateProjectionMatrix();
        key.shadow.needsUpdate = true;
      }

      // イントロ用に球面座標も返す（OrbitControls と同じ概念）
      const spherical = new THREE.Spherical().setFromVector3(offsetVec);
      return {
        radius,
        target: target.clone(),
        camPos: camPos.clone(),
        spherical: { radius: spherical.radius, phi: spherical.phi, theta: spherical.theta }
      };
    }

    // Intro animation: ズームしながら一定角度回転して初期視点に着地
    let introActive = false;
    let introT = 0;
    const introParam = params.get('intro'); // 秒数 or off/0
    const introDur = (introParam && (introParam.toLowerCase() === 'off' || introParam === '0'))
      ? 0
      : Math.max(0.8, Math.min(3.0, parseFloat(introParam || '1.6')));

    let intro = null;
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function startIntro(fit) {
      if (!fit || introDur <= 0) return;
      if (!fit.spherical) return;

      introActive = true;
      introT = 0;

      controls.enabled = false;
      controls.enableDamping = false;

      // イントロの「着地点」は frameSelection が作ったカメラ位置そのものにする
      const end = {
        target: fit.target.clone(),
        radius: fit.spherical.radius,
        phi: fit.spherical.phi,
        theta: fit.spherical.theta,
      };

      // スタートは「少し遠く」＆「一定角度回り込んだ位置」
      const start = {
        radius: end.radius * 1.9,
        phi: end.phi,
        theta: end.theta - Math.PI * 0.65,
      };

      intro = { start, end };

      // 初期位置に即移動
      const off = new THREE.Vector3().setFromSphericalCoords(start.radius, start.phi, start.theta);
      camera.position.copy(end.target.clone().add(off));
      controls.target.copy(end.target);
      camera.lookAt(end.target);
      controls.update(); // OrbitControls を同期
    }

    async function loadOBJ(objUrl, mtlUrl) {
      try {
        clearModel();

        // baseDir をOBJ側に合わせる（mtl/textureの相対参照が安定）
        const objAbs = new URL(objUrl, location.href).href;
        const baseDir = objAbs.substring(0, objAbs.lastIndexOf('/') + 1);

        // ローダーのパス設定を明確化（絶対URLはそのまま、テクスチャはbaseDirから解決）
        mtlLoader.setPath('');            // mtlファイル自体は絶対URLで読み込む
        mtlLoader.setResourcePath(baseDir); // mtl内の map_Kd 等の参照をこのディレクトリ基準にする
        objLoader.setPath('');            // objファイル自体は絶対URLで読み込む

        if (mtlUrl) {
          const mtlAbs = new URL(mtlUrl, location.href).href;
          const materials = await mtlLoader.loadAsync(mtlAbs);
          // OBJ/MTL テクスチャの向きを統一（念のため）
          for (const k in materials.materials) {
            const m = materials.materials[k];
            if (m?.map) m.map.flipY = true;
          }
          materials.preload();
          objLoader.setMaterials(materials);
        } else {
          objLoader.setMaterials(null);
        }

        const root = await objLoader.loadAsync(objAbs);

        // PBR寄りに寄せる（見た目安定）
        // NOTE: MTLLoader が作った map_Kd（material.map）を捨てないこと！
        // 目的：ブロックは明るすぎない／床（暗色）は少しだけ持ち上げる
        const envInt = parseFloat(params.get('envIntensity') || '1.0'); // 反射強さ（強すぎると白飛び）
        const floorBoost = parseFloat(params.get('floorBoost') || '3.0'); // 暗色だけ明るく

        function luminance(color) {
          // ざっくり輝度（近似）
          return 0.2126 * color.r + 0.7152 * color.g + 0.0722 * color.b;
        }

        function toStandardMaterial(src) {
          // MTLLoader は MeshPhongMaterial を返すことが多い
          const srcMat = src || {};
          const baseColor = srcMat.color ? srcMat.color.clone() : new THREE.Color(0xdddddd);

          // --- Debug / overrides ---
          const debugOn = (params.get('debugColor') || '').toLowerCase() === 'on';
          const debugMat = (params.get('debugMat') || '').trim(); // 例) ?debugMat=MB_21 でそのマテリアルだけログ
          const debugThis = debugOn && (!debugMat || srcMat.name === debugMat);

          // マテリアル名で red/pink 判定を強制したい場合（カンマ区切り）
          // 例) ?pinkMats=MB_21,MB_999&redMats=MB_353
          const parseList = (s) => (s || '').split(',').map(v => v.trim()).filter(Boolean);
          // const forcedPink = new Set(parseList(params.get('pinkMats')));
          // const forcedRed  = new Set(parseList(params.get('redMats')));
          const forcedPink = new Set(parseList(params.get('pinkMats') || 'MB_353'));
          const forcedRed  = new Set(parseList(params.get('redMats')  || 'MB_21'));
          const forced = forcedPink.has(srcMat.name) ? 'pink' : (forcedRed.has(srcMat.name) ? 'red' : '');

          // 単色マテリアル（テクスチャ無し）だけ色味を微調整して、赤とピンクを見分けやすくする。
          // - デフォルトON（必要なら ?colorTune=off で無効化）
          // - 調整値はURLで上書き可能
          //    例) ?pinkSat=0.80&pinkLight=1.06&pinkHue=0.02&redSat=0.98&swapSat=on  |  判定調整: satMin=0.18&redHueDist=0.06&pinkHueMin=0.83&pinkHueMax=0.97  |  (明るい赤をピンク扱いにするなら pinkAlt=on&pinkLightAlt=0.70)  |  debugColor=on&debugMat=MB_21
          //    強制: ?pinkMats=MB_21,MB_999&redMats=MB_353
          const colorTuneOff = (params.get('colorTune') || '').toLowerCase() === 'off';
          const hasMap = !!srcMat.map;
          let tuned = false;
          if (!colorTuneOff && !hasMap) {
            // 重要: 判定・調整を linear の HSL でやると不安定になりやすいので、sRGB 空間で行う
            const cSRGB = baseColor.clone().convertLinearToSRGB();

            // 判定用（変更前）HSL
            const hsl0 = { h: 0, s: 0, l: 0 };
            cSRGB.getHSL(hsl0);

            // 変更用HSL
            const hsl = { h: hsl0.h, s: hsl0.s, l: hsl0.l };

            // デフォルト値（Sketchfabっぽく：ピンクは薄め＆少し明るめ）
            let redSat    = parseFloat(params.get('redSat')    || '0.9');
            let pinkSat   = parseFloat(params.get('pinkSat')   || '0.4');
            const pinkLight = parseFloat(params.get('pinkLight') || '1.04');
            const pinkHue   = parseFloat(params.get('pinkHue')   || '0.015');

            // 一部モデルで「分類（isRed/isPink）」と、ユーザーが期待する“赤ブロック/ピンクブロック”が逆になる場合に
            // 影響パラメータだけ入れ替える。例) &swapSat=on
            const swapSat = (params.get('swapSat') || '').toLowerCase() === 'on';
            if (swapSat) {
              const tmp = redSat;
              redSat = pinkSat;
              pinkSat = tmp;
            }

            const clamp01 = (v) => Math.max(0, Math.min(1, v));

            // 判定パラメータ（URLで調整可能）
            // 例) &satMin=0.18&redHueDist=0.06&pinkHueMin=0.83&pinkLightAlt=0.62
            const satMin       = parseFloat(params.get('satMin')       || '0.18');
            const redHueDist   = parseFloat(params.get('redHueDist')   || '0.06');
            const pinkHueMin   = parseFloat(params.get('pinkHueMin')   || '0.83');
            const pinkHueMax   = parseFloat(params.get('pinkHueMax')   || '0.97'); // ★追加：赤ラップ(1.0付近)を除外
            const pinkLightAlt = parseFloat(params.get('pinkLightAlt') || '0.62');
            // nearRed をピンク扱いにする“救済”を使うか（明るい赤系をピンクに寄せたい時だけON）
            // 例) &pinkAlt=on&pinkLightAlt=0.70
            const pinkAltOn = (params.get('pinkAlt') || '').toLowerCase() === 'on';

            // Hueは0/1でラップするので距離で判定（0=赤）
            const hueDistToRed = Math.min(hsl0.h, 1.0 - hsl0.h);
            const nearRed = hueDistToRed <= redHueDist;
            const nearMagenta = (hsl0.h >= pinkHueMin && hsl0.h <= pinkHueMax); // 0.83〜0.97
            const satOk = hsl0.s >= satMin;

            // 自動判定
            const isPinkAuto = satOk && (nearMagenta || (pinkAltOn && nearRed && hsl0.l >= pinkLightAlt));
            const isRedAuto  = satOk && nearRed && !isPinkAuto;

            // 強制指定があれば優先（モデル側で「ピンク面に赤マテリアル名が割り当てられている」ケースの対策）
            const isPink = (forced === 'pink') ? true : (forced === 'red') ? false : isPinkAuto;
            const isRed  = (forced === 'red')  ? true : (forced === 'pink') ? false : isRedAuto;

            // ピンク判定を優先
            if (isPink) {
              tuned = true;
              if (isFinite(pinkSat) && pinkSat !== 1.0) hsl.s = clamp01(hsl.s * pinkSat);
              if (isFinite(pinkLight) && pinkLight !== 1.0) hsl.l = clamp01(hsl.l * pinkLight);
              if (isFinite(pinkHue) && pinkHue !== 0.0) hsl.h = (hsl.h + pinkHue) % 1.0;
            } else if (isRed) {
              tuned = true;
              if (isFinite(redSat) && redSat !== 1.0) hsl.s = clamp01(hsl.s * redSat);
            }

            // sRGBでHSLを適用 → linear に戻す
            cSRGB.setHSL(hsl.h, hsl.s, hsl.l);
            cSRGB.convertSRGBToLinear();
            baseColor.copy(cSRGB);

            // デバッグ: ?debugColor=on（必要なら ?debugMat=MB_21 で対象を絞る）
            // Console上で展開しなくてもコピペできるよう、1行JSONも出す
            if (debugThis) {
              const c0 = baseColor.clone().convertLinearToSRGB();
              const dbg = {
                mat: srcMat.name || '(no-name)',
                forced,              // 'pink' | 'red' | ''
                hasMap,              // テクスチャありなら tune 対象外
                tuned,               // 実際に調整を適用したか
                rgb_srgb: { r: +c0.r.toFixed(4), g: +c0.g.toFixed(4), b: +c0.b.toFixed(4) },
                hsl0: { h: +hsl0.h.toFixed(4), s: +hsl0.s.toFixed(4), l: +hsl0.l.toFixed(4) },
                isRed,
                isPink,
                satMin,
                redHueDist,
                pinkHueMin,
                pinkHueMax,
                pinkLightAlt,
                pinkAltOn,
                params: {
                  swapSat,
                  redSat: +redSat.toFixed(4),
                  pinkSat: +pinkSat.toFixed(4),
                  pinkLight: +pinkLight.toFixed(4),
                  pinkHue: +pinkHue.toFixed(4)
                }
              };
              console.log('colorTune', dbg);
              console.log('colorTuneJSON', JSON.stringify(dbg));
            }
          }

          // 追加の全体彩度調整（単色のみ・任意）
          // 例) ?sat=0.95（全体を少し落とす） / 指定しなければ無効
          if (params.has('sat') && !srcMat.map) {
            const sat = parseFloat(params.get('sat') || '1.0');
            if (isFinite(sat) && sat !== 1.0) {
              const hsl = {};
              baseColor.getHSL(hsl);
              baseColor.setHSL(hsl.h, Math.max(0, Math.min(1, hsl.s * sat)), hsl.l);
            }
          }

          // 追加の色グループ調整（他の色でも同じ仕組みで調整できるように）
          // 目的：
          //  - 床面の深緑を少し明るく（沈みを軽減）
          //  - 一部のグレー部材を少し薄めのグレーに
          // 方針：テクスチャ無し（単色）に限り、sRGBのHSLで判定して補正。
          // さらに「マテリアル名の強制リスト」も用意（最終手段）。
          //
          // 使い方（例）
          //  - 緑床を少し持ち上げ:  &greenLift=1.25
          //  - グレーを少し明るく:  &grayLift=1.18&graySat=0.92
          //  - 判定をマテリアル名で強制: &greenMats=MB_37&grayMats=MB_12,MB_99
          if (!srcMat.map) {
            // sRGBで判定・補正
            const cSRGB2 = baseColor.clone().convertLinearToSRGB();
            const hsl2 = { h: 0, s: 0, l: 0 };
            cSRGB2.getHSL(hsl2);

            const clamp01 = (v) => Math.max(0, Math.min(1, v));
            const parseList2 = (s) => (s || '').split(',').map(v => v.trim()).filter(Boolean);
            const forcedGreen  = new Set(parseList2(params.get('greenMats')));
            const forcedGray   = new Set(parseList2(params.get('grayMats')));
            const forcedBrown  = new Set(parseList2(params.get('brownMats')));
            const forcedYellow = new Set(parseList2(params.get('yellowMats')));
            const forcedBlue   = new Set(parseList2(params.get('blueMats')));
            const forcedCyan   = new Set(parseList2(params.get('cyanMats')));
            const forcedOrange = new Set(parseList2(params.get('orangeMats')));
            const matName = (srcMat.name || '').trim();

            // --- Debug helpers for group detection ---
            const debugOn2 = (params.get('debugColor') || '').toLowerCase() === 'on';
            const debugMat2 = (params.get('debugMat') || '').trim();
            const debugThis2 = debugOn2 && (!debugMat2 || matName === debugMat2);

            // ---- Green (dark green floor) ----
            // デフォルトは無効（1.0）
            const greenLift = parseFloat(params.get('greenLift') || '3.5');
            const greenSat  = parseFloat(params.get('greenSat')  || '1.0');
            const greenHueMin = parseFloat(params.get('greenHueMin') || '0.25'); // だいたい緑
            const greenHueMax = parseFloat(params.get('greenHueMax') || '0.45');
            const greenSatMin = parseFloat(params.get('greenSatMin') || '0.25');
            const greenLumMax = parseFloat(params.get('greenLumMax') || '0.38'); // 暗めだけ対象

            const isGreenForced = matName && forcedGreen.has(matName);
            const isGreenAuto = (hsl2.h >= greenHueMin && hsl2.h <= greenHueMax) && (hsl2.s >= greenSatMin) && (hsl2.l <= greenLumMax);
            const isGreen = isGreenForced || isGreenAuto;

            if (isGreen && isFinite(greenLift) && greenLift !== 1.0) {
              hsl2.l = clamp01(hsl2.l * greenLift);
              if (isFinite(greenSat) && greenSat !== 1.0) hsl2.s = clamp01(hsl2.s * greenSat);
            }

            // ---- Brown (dark brown floor) ----
            // デフォルトは無効（1.0）
            // 例) &brownLift=1.22&brownSat=1.08
            const brownLift = parseFloat(params.get('brownLift') || '2.0');
            const brownSat  = parseFloat(params.get('brownSat')  || '1.5');
            const brownHueMin = parseFloat(params.get('brownHueMin') || '0.03');
            const brownHueMax = parseFloat(params.get('brownHueMax') || '0.13');
            const brownSatMin = parseFloat(params.get('brownSatMin') || '0.22');
            const brownLumMax = parseFloat(params.get('brownLumMax') || '0.42'); // 暗めだけ対象

            const isBrownForced = matName && forcedBrown.has(matName);
            const isBrownAuto = (hsl2.h >= brownHueMin && hsl2.h <= brownHueMax) && (hsl2.s >= brownSatMin) && (hsl2.l <= brownLumMax);
            const isBrown = isBrownForced || isBrownAuto;

            if (isBrown && isFinite(brownLift) && brownLift !== 1.0) {
              hsl2.l = clamp01(hsl2.l * brownLift);
              if (isFinite(brownSat) && brownSat !== 1.0) hsl2.s = clamp01(hsl2.s * brownSat);
            }

            // ---- Yellow (minifig face / yellow parts) ----
            // 目的：赤っぽく転んだ黄色を、より黄色らしく（赤みを減らす）
            // デフォルトは無効（1.0 / 0.0）
            // 例) &yellowLift=1.05&yellowSat=1.02&yellowHue=0.02
            const yellowLift = parseFloat(params.get('yellowLift') || '1.1');
            const yellowSat  = parseFloat(params.get('yellowSat')  || '0.7');
            const yellowHue  = parseFloat(params.get('yellowHue')  || '0.02'); // +で黄方向(緑寄り)へ、-で赤寄りへ

            // 自動判定の範囲（URLで調整可）
            // Hueは0..1で、黄はだいたい 0.06〜0.20 付近。
            // ※このモデルでは h=0.075 前後が黄パーツとして出ていたので、下限を少し広げる
            const yellowHueMin = parseFloat(params.get('yellowHueMin') || '0.06');
            const yellowHueMax = parseFloat(params.get('yellowHueMax') || '0.20');
            const yellowSatMin = parseFloat(params.get('yellowSatMin') || '0.12');
            const yellowLumMin = parseFloat(params.get('yellowLumMin') || '0.12');
            const yellowLumMax = parseFloat(params.get('yellowLumMax') || '0.92');

            // Hueだけだと判定漏れすることがあるので、RGBの“黄っぽさ”も併用（保険）
            // - 赤と緑が強く、青が弱い（=黄〜橙に見える）
            const rgbYellowish = (cSRGB2.r >= 0.45 && cSRGB2.g >= 0.25 && cSRGB2.b <= 0.20);

            const isYellowForced = matName && forcedYellow.has(matName);
            const isYellowAuto = (
              ((hsl2.h >= yellowHueMin && hsl2.h <= yellowHueMax) || rgbYellowish)
              && (hsl2.s >= yellowSatMin)
              && (hsl2.l >= yellowLumMin && hsl2.l <= yellowLumMax)
            );
            const isYellow = isYellowForced || isYellowAuto;

            // --- Debug log for yellow detection ---
            if (debugThis2) {
              console.log('groupDetect', {
                mat: matName,
                hsl_srgb: { h: +hsl2.h.toFixed(4), s: +hsl2.s.toFixed(4), l: +hsl2.l.toFixed(4) },
                rgb_srgb: { r: +cSRGB2.r.toFixed(4), g: +cSRGB2.g.toFixed(4), b: +cSRGB2.b.toFixed(4) },
                isYellow,
                isYellowForced,
                rgbYellowish,
                yellowHueMin,
                yellowHueMax,
                yellowSatMin,
                yellowLumMin,
                yellowLumMax
              });
            }

            if (isYellow) {
              if (isFinite(yellowHue) && yellowHue !== 0.0) hsl2.h = (hsl2.h + yellowHue + 1.0) % 1.0;
              if (isFinite(yellowLift) && yellowLift !== 1.0) hsl2.l = clamp01(hsl2.l * yellowLift);
              if (isFinite(yellowSat) && yellowSat !== 1.0) hsl2.s = clamp01(hsl2.s * yellowSat);
            }

            // ---- Orange (orange parts) ----
            // 目的：オレンジの彩度/明るさ/色相を個別に調整
            // NOTE: 黄や茶と色域が近く誤爆しやすいので、
            //  - デフォルトでは「黄/茶に該当するもの」はオレンジ判定から除外
            //  - 暗すぎる(床の茶) / 明るすぎる(黄) は除外
            //  - Hueレンジだけで漏れる場合に備えてRGBの“オレンジっぽさ”も併用
            //
            // 例) &orangeLift=1.06&orangeSat=1.03&orangeHue=-0.005
            // 例) 判定調整: &orangeHueMin=0.02&orangeHueMax=0.07&orangeSatMin=0.22&orangeLumMin=0.18&orangeLumMax=0.85
            const orangeLift = parseFloat(params.get('orangeLift') || '0.8');
            const orangeSat  = parseFloat(params.get('orangeSat')  || '0.9');
            const orangeHue  = parseFloat(params.get('orangeHue')  || '0.0'); // +で黄寄り、-で赤寄り

            // 黄(h≈0.075)と茶(h≈0.05, 暗い)の間に入りやすいので、デフォルトを少し狭める
            const orangeHueMin = parseFloat(params.get('orangeHueMin') || '0.02');
            const orangeHueMax = parseFloat(params.get('orangeHueMax') || '0.07');
            const orangeSatMin = parseFloat(params.get('orangeSatMin') || '0.22');
            // 暗い茶床を除外するために下限を上げ、黄の白飛び側も除外
            const orangeLumMin = parseFloat(params.get('orangeLumMin') || '0.18');
            const orangeLumMax = parseFloat(params.get('orangeLumMax') || '0.85');

            // Hueだけだと判定漏れすることがあるのでRGBの保険
            // - Rが強く、Gが中程度、Bが弱い（黄はGが強すぎる/明るすぎることが多い）
            const rgbOrangish = (
              cSRGB2.r >= 0.55 &&
              cSRGB2.g >= 0.18 && cSRGB2.g <= 0.55 &&
              cSRGB2.b <= 0.18 &&
              cSRGB2.r >= cSRGB2.g * 1.05
            );

            const isOrangeForced = matName && forcedOrange.has(matName);
            const isOrangeAuto = (
              // 強制でない場合は黄/茶を優先して除外（誤爆防止）
              !isYellow && !isBrown &&
              // Hueレンジ or RGB保険
              ((hsl2.h >= orangeHueMin && hsl2.h <= orangeHueMax) || rgbOrangish) &&
              (hsl2.s >= orangeSatMin) &&
              (hsl2.l >= orangeLumMin && hsl2.l <= orangeLumMax)
            );
            const isOrange = isOrangeForced || isOrangeAuto;

            if (debugThis2) {
              console.log('groupDetect_orange', {
                mat: matName,
                hsl_srgb: { h: +hsl2.h.toFixed(4), s: +hsl2.s.toFixed(4), l: +hsl2.l.toFixed(4) },
                rgb_srgb: { r: +cSRGB2.r.toFixed(4), g: +cSRGB2.g.toFixed(4), b: +cSRGB2.b.toFixed(4) },
                isOrange,
                isOrangeForced,
                isYellow,
                isBrown,
                rgbOrangish,
                orangeHueMin,
                orangeHueMax,
                orangeSatMin,
                orangeLumMin,
                orangeLumMax
              });
            }

            if (isOrange) {
              if (isFinite(orangeHue) && orangeHue !== 0.0) hsl2.h = (hsl2.h + orangeHue + 1.0) % 1.0;
              if (isFinite(orangeLift) && orangeLift !== 1.0) hsl2.l = clamp01(hsl2.l * orangeLift);
              if (isFinite(orangeSat) && orangeSat !== 1.0) hsl2.s = clamp01(hsl2.s * orangeSat);
            }

            // ---- Cyan / Light blue (cyan parts) ----
            // 目的：水色（シアン）を個別に調整
            // 例) &cyanLift=1.05&cyanSat=0.98&cyanHue=0.0
            const cyanLift = parseFloat(params.get('cyanLift') || '1.0');
            const cyanSat  = parseFloat(params.get('cyanSat')  || '1.0');
            const cyanHue  = parseFloat(params.get('cyanHue')  || '0.0');

            const cyanHueMin = parseFloat(params.get('cyanHueMin') || '0.46');
            const cyanHueMax = parseFloat(params.get('cyanHueMax') || '0.58');
            const cyanSatMin = parseFloat(params.get('cyanSatMin') || '0.18');
            const cyanLumMin = parseFloat(params.get('cyanLumMin') || '0.08');
            const cyanLumMax = parseFloat(params.get('cyanLumMax') || '0.95');

            const isCyanForced = matName && forcedCyan.has(matName);
            const isCyanAuto = (
              (hsl2.h >= cyanHueMin && hsl2.h <= cyanHueMax)
              && (hsl2.s >= cyanSatMin)
              && (hsl2.l >= cyanLumMin && hsl2.l <= cyanLumMax)
            );
            const isCyan = isCyanForced || isCyanAuto;

            if (debugThis2) {
              console.log('groupDetect_cyan', {
                mat: matName,
                hsl_srgb: { h: +hsl2.h.toFixed(4), s: +hsl2.s.toFixed(4), l: +hsl2.l.toFixed(4) },
                rgb_srgb: { r: +cSRGB2.r.toFixed(4), g: +cSRGB2.g.toFixed(4), b: +cSRGB2.b.toFixed(4) },
                isCyan,
                isCyanForced,
                cyanHueMin,
                cyanHueMax,
                cyanSatMin,
                cyanLumMin,
                cyanLumMax
              });
            }

            if (isCyan) {
              if (isFinite(cyanHue) && cyanHue !== 0.0) hsl2.h = (hsl2.h + cyanHue + 1.0) % 1.0;
              if (isFinite(cyanLift) && cyanLift !== 1.0) hsl2.l = clamp01(hsl2.l * cyanLift);
              if (isFinite(cyanSat) && cyanSat !== 1.0) hsl2.s = clamp01(hsl2.s * cyanSat);
            }

            // ---- Blue (blue parts) ----
            // 目的：青を個別に調整
            // 例) &blueLift=1.04&blueSat=0.98&blueHue=0.0
            const blueLift = parseFloat(params.get('blueLift') || '1.5');
            const blueSat  = parseFloat(params.get('blueSat')  || '0.8');
            const blueHue  = parseFloat(params.get('blueHue')  || '0.0');

            const blueHueMin = parseFloat(params.get('blueHueMin') || '0.58');
            const blueHueMax = parseFloat(params.get('blueHueMax') || '0.72');
            const blueSatMin = parseFloat(params.get('blueSatMin') || '0.18');
            const blueLumMin = parseFloat(params.get('blueLumMin') || '0.06');
            const blueLumMax = parseFloat(params.get('blueLumMax') || '0.95');

            const isBlueForced = matName && forcedBlue.has(matName);
            const isBlueAuto = (
              (hsl2.h >= blueHueMin && hsl2.h <= blueHueMax)
              && (hsl2.s >= blueSatMin)
              && (hsl2.l >= blueLumMin && hsl2.l <= blueLumMax)
            );
            const isBlue = isBlueForced || isBlueAuto;

            if (debugThis2) {
              console.log('groupDetect_blue', {
                mat: matName,
                hsl_srgb: { h: +hsl2.h.toFixed(4), s: +hsl2.s.toFixed(4), l: +hsl2.l.toFixed(4) },
                rgb_srgb: { r: +cSRGB2.r.toFixed(4), g: +cSRGB2.g.toFixed(4), b: +cSRGB2.b.toFixed(4) },
                isBlue,
                isBlueForced,
                blueHueMin,
                blueHueMax,
                blueSatMin,
                blueLumMin,
                blueLumMax
              });
            }

            if (isBlue) {
              if (isFinite(blueHue) && blueHue !== 0.0) hsl2.h = (hsl2.h + blueHue + 1.0) % 1.0;
              if (isFinite(blueLift) && blueLift !== 1.0) hsl2.l = clamp01(hsl2.l * blueLift);
              if (isFinite(blueSat) && blueSat !== 1.0) hsl2.s = clamp01(hsl2.s * blueSat);
            }

            // ---- Gray (low-saturation parts) ----
            // デフォルトは無効（1.0）
            const grayLift = parseFloat(params.get('grayLift') || '2.0');
            const graySat  = parseFloat(params.get('graySat')  || '0.92');
            const graySatMax = parseFloat(params.get('graySatMax') || '0.14');
            const grayLumMin = parseFloat(params.get('grayLumMin') || '0.06');
            const grayLumMax = parseFloat(params.get('grayLumMax') || '0.65');

            const isGrayForced = matName && forcedGray.has(matName);
            const isGrayAuto = (hsl2.s <= graySatMax) && (hsl2.l >= grayLumMin) && (hsl2.l <= grayLumMax);
            const isGray = isGrayForced || isGrayAuto;

            if (isGray && isFinite(grayLift) && grayLift !== 1.0) {
              hsl2.l = clamp01(hsl2.l * grayLift);
              if (isFinite(graySat) && graySat !== 1.0) hsl2.s = clamp01(hsl2.s * graySat);
            }

            // 反映（sRGB→linearへ戻す）
            cSRGB2.setHSL(hsl2.h, hsl2.s, hsl2.l);
            cSRGB2.convertSRGBToLinear();
            baseColor.copy(cSRGB2);
          }

          const std = new THREE.MeshStandardMaterial({
            color: baseColor,
            metalness: 0.03,
            roughness: 0.8,
            transparent: !!srcMat.transparent,
            opacity: (typeof srcMat.opacity === 'number') ? srcMat.opacity : 1.0,
            side: (typeof srcMat.side === 'number') ? srcMat.side : THREE.FrontSide,
          });

          // --- Preserve texture maps from MTL (map_Kd etc.) ---
          if (srcMat.map) {
            std.map = srcMat.map;
            // Diffuse は sRGB
            std.map.colorSpace = THREE.SRGBColorSpace;
            std.map.needsUpdate = true;
          }

          // Alpha/opacity
          if (srcMat.alphaMap) std.alphaMap = srcMat.alphaMap;
          if (srcMat.transparent || srcMat.alphaMap) std.transparent = true;

          // Normal / bump
          if (srcMat.normalMap) std.normalMap = srcMat.normalMap;
          if (srcMat.bumpMap) std.bumpMap = srcMat.bumpMap;
          if (typeof srcMat.bumpScale === 'number') std.bumpScale = srcMat.bumpScale;

          // Emissive（あれば）
          if (srcMat.emissive) std.emissive = srcMat.emissive.clone();
          if (srcMat.emissiveMap) {
            std.emissiveMap = srcMat.emissiveMap;
            std.emissiveMap.colorSpace = THREE.SRGBColorSpace;
            std.emissiveMap.needsUpdate = true;
          }

          std.envMapIntensity = (isFinite(envInt) ? envInt : 0.75);

          // 暗い色（床など）だけ少しだけ明るくする
          const lum = luminance(std.color);
          if (isFinite(floorBoost) && floorBoost !== 1.0 && lum < 0.24) {
            std.color.multiplyScalar(floorBoost);
          }

          return std;
        }

        root.traverse((n) => {
          if (!n.isMesh) return;

          // material が配列（マルチマテリアル）な場合もある
          if (Array.isArray(n.material)) {
            n.material = n.material.map((m) => toStandardMaterial(m));
          } else {
            n.material = toStandardMaterial(n.material);
          }

          // 影
          n.castShadow = !shadowsOff;
          n.receiveShadow = !shadowsOff;

          if (n.geometry && !n.geometry.attributes.normal) n.geometry.computeVertexNormals();
        });

        currentObject = root;
        pivot.add(root);

        // スケール
        const scale = parseFloat(params.get('scale') || '1');
        if (isFinite(scale) && scale !== 1) root.scale.setScalar(scale);

        const fit = frameSelection(root);
        startIntro(fit);

        showToast('OBJを読み込みました');
      } catch (e) {
        console.error(e);
        showToast('読み込みに失敗: ' + (e?.message || e));
      }
    }

    // モデル指定（デフォルトは例として入れておく：あなたの構成に合わせて変更OK）
    // 例: /?model=/asset/nazo1/nazo1.obj&mtl=/asset/nazo1/nazo1.mtl&ui=off&intro=1.6
    const modelUrl = params.get('model') || '/asset/nazo1/nazo1.obj';
    const mtlUrl = params.get('mtl');
    loadOBJ(modelUrl, mtlUrl);

    // Toolbar
    const autorotateBtn = document.getElementById('autorotateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const gridBtn = document.getElementById('gridBtn');
    const bgBtn = document.getElementById('bgBtn');

    // 初期状態を反映
    gridBtn.setAttribute('aria-pressed', String(grid.visible));

    autorotateBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      autorotateBtn.setAttribute('aria-pressed', String(autoRotate));
    });

    resetBtn.addEventListener('click', () => {
      controls.reset();
      if (currentObject) frameSelection(currentObject, 1.7);
    });

    gridBtn.addEventListener('click', () => {
      grid.visible = !grid.visible;
      gridBtn.setAttribute('aria-pressed', String(grid.visible));
    });

    bgBtn.addEventListener('click', () => {
      backgroundSolid = !backgroundSolid;
      scene.background = backgroundSolid ? BG_LIGHT : BG_DARK;
    });

    // Resize
    function onResize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);
    onResize();

    // Animate
    let last = performance.now();
    function tick(now) {
      const dt = Math.min((now - last) / 1000, 1 / 15);
      last = now;

      if (introActive && intro) {
        introT += dt;
        const t = Math.min(introT / introDur, 1);
        const e = easeInOutCubic(t);

        const theta = THREE.MathUtils.lerp(intro.start.theta, intro.end.theta, e);
        const radius = THREE.MathUtils.lerp(intro.start.radius, intro.end.radius, e);
        const phi = intro.end.phi; // 高さ（俯角）は固定

        const target = intro.end.target;
        const off = new THREE.Vector3().setFromSphericalCoords(radius, phi, theta);
        camera.position.copy(target.clone().add(off));

        controls.target.copy(target);
        camera.lookAt(target);
        controls.update(); // 毎フレーム OrbitControls を同期（ズレ防止）

        if (t >= 1) {
          introActive = false;

          // イントロの最終値にスナップして、OrbitControlsの内部状態と完全一致させる
          const target = intro.end.target;
          const off = new THREE.Vector3().setFromSphericalCoords(intro.end.radius, intro.end.phi, intro.end.theta);
          camera.position.copy(target.clone().add(off));
          controls.target.copy(target);
          camera.lookAt(target);

          controls.enabled = true;
          controls.enableDamping = WAS_DAMPING;

          controls.saveState();
          controls.update();
        }

      } else {
        if (autoRotate && currentObject) currentObject.rotation.y += dt * 0.6;
        controls.update();
      }

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

  <!--
  使い方（段階的に追加した機能）

  1) 純ビューア（UI消し）
     - デフォルトで UI は非表示
     /?model=/asset/nazo1/nazo1.obj&mtl=/asset/nazo1/nazo1.mtl

     UIを表示したい場合:
     /?model=/asset/nazo1/nazo1.obj&mtl=/asset/nazo1/nazo1.mtl&ui=on

  2) リッチなライティング
     - HDRを使う: &hdr=/asset/studio_small_09_2k.hdr
     - 無い場合でも RoomEnvironment を使って環境反射が入ります

  3) 初期アクション（ズームしながら一定角度回転）
     - デフォルトで 1.6秒
     - 秒数指定: &intro=2.2
     - 無効化: &intro=off  または &intro=0

  メモ
  - OBJ+MTLのテクスチャ参照は mtl 内の相対パスに依存します。OBJと同じフォルダ配下に置くのが安全。
  - 影は重いので、必要になってから renderer.shadowMap.enabled=true とライト/床設定を追加するのがおすすめ。
